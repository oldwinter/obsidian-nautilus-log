name: Issue 22 release evidence

on:
  pull_request:
    paths:
      - ".github/workflows/issue-22-release-evidence.yml"
      - "docs/parity/**"
      - "docs/planning-github-graph.json"
      - "docs/planning-local-links.json"
      - "docs/implementation-dossier.md"
      - "docs/decisions/**"
      - "docs/research/behavior-inventory.md"
      - "scripts/release/**"
      - "scripts/verify/**"
      - "tests/fixtures/**"
      - "tests/release/**"
      - "scripts/check-planning-docs.mjs"
      - "scripts/generate-planning-local-links.mjs"
      - "scripts/generate-requirement-owners.mjs"
  push:
    branches:
      - "implement/issue-22-evidence"

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/release/*.test.mjs
      - run: node scripts/release/dry-run.mjs
      - run: node scripts/check-planning-docs.mjs --sha HEAD
      - run: npm run verify
      - run: npm run validate:provenance
