name: Issue 22 release evidence

on:
  pull_request:
    paths:
      - ".github/workflows/issue-22-release-evidence.yml"
      - "docs/parity/**"
      - "scripts/release/**"
      - "scripts/verify/**"
      - "tests/fixtures/**"
      - "tests/release/**"
  push:
    branches:
      - "implement/issue-22-evidence"

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/release/release-gates.test.mjs
      - run: node scripts/release/dry-run.mjs
      - run: npm run verify
      - run: npm run validate:provenance
